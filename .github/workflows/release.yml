name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.3.3-alpha)'
        required: true
        default: 'v0.3.3-alpha'
      prerelease:
        description: 'Mark as pre-release?'
        required: true
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpcap-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Determine release info
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ github.event.inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            # Mark as pre-release if tag contains alpha/beta/rc
            if echo "${{ github.ref_name }}" | grep -qE '(alpha|beta|rc)'; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release_info.outputs.tag }}
          releaseName: 'LEGION2 ${{ steps.release_info.outputs.tag }}'
          releaseBody: |
            ## LEGION2 ${{ steps.release_info.outputs.tag }}

            ### Installation

            **Debian/Ubuntu/Kali/ParrotOS (.deb):**
            ```bash
            sudo dpkg -i legion2_*.deb
            # Grant capabilities for passive capture and masscan (optional)
            sudo setcap cap_net_raw,cap_net_admin=eip $(which masscan)
            sudo setcap cap_net_raw+ep /usr/bin/legion2
            ```

            **AppImage (any Linux):**
            ```bash
            chmod +x legion2_*.AppImage
            ./legion2_*.AppImage
            ```

            > **Note:** Quick scan (`-sT` mode) works without root. Comprehensive scan, NetSniffer,
            > and masscan require `cap_net_raw` or running as root.

            See the [README](https://github.com/NubleX/LEGION2/blob/main/README.md) for full
            installation instructions and prerequisites.
          releaseDraft: false
          prerelease: ${{ steps.release_info.outputs.prerelease }}
          includeUpdaterJson: false
