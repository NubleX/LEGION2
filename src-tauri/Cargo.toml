[package]
name = "legion2"
version = "0.3.0"
description = "LEGION2 - Network Penetration Testing Tool"
authors = ["Igor Dunaev"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
tauri = { version = "2.3.0", features = [] }
tauri-plugin-shell = "2.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.18.0", features = ["v4"] }
regex = "1.10"
ipnet = "2.8"
anyhow = "1.0.99"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11.8"
quick-xml = { version = "0.38.1", features = ["serialize"] }
rusqlite = { version = "0.37.0", features = ["bundled", "chrono"] }
async-trait = "0.1.89"
futures = "0.3"
parking_lot = "0.12"
dirs = "5.0"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
rand = "0.8"

# For Windows-specific networking
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winnt", "processthreadsapi"] }

# For Unix privilege checking
[target.'cfg(unix)'.dependencies]
libc = "0.2.175"

[features]
cli = []
