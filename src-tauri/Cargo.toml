[package]
name = "legion2"
version = "0.3.0-alpha"
description = "LEGION2 - Network Penetration Testing Tool"
authors = ["Igor Dunaev"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
tauri = { version = "2.3.0", features = [] }
tauri-plugin-shell = "2.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.8", features = ["v4"] }
regex = "1.10"
ipnet = "2.8"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.10"
quick-xml = { version = "0.29", features = ["serialize"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
async-trait = "0.1"
futures = "0.3"

# For Windows-specific networking
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winnt", "processthreadsapi"] }

# For Unix privilege checking
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
cli = []
